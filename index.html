<!DOCTYPE html>
<html>

<head>

<title>Login - AI Smart House</title>

<link rel="stylesheet" href="style.css">

</head>

<body class="loginBody">
<center>
<div class="loginBox">
<h1>AI Smart House Login</h1>
<input
id="username"
type="text"
placeholder="Enter Username">

<input
id="password"
type="password"
placeholder="Enter Password">

<button onclick="login()">
Login
</button>

<p id="loginStatus"></p>

</div>
</center>

<script src="login.js"></script>

</body>

</html>
